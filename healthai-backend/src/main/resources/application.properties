spring.application.name=afyaai-backend

server.port=${SERVER_PORT:3000}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/afyaai}
spring.datasource.username=${DB_USER:afyaai}
spring.datasource.password=${DB_PASSWORD:afyaai}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.hibernate.SQL=INFO
